w:()=>B('Hello, welcome to your consultation here. I will ask a few questions, one at a time, to work out where your pain may come from.','مرحباً بك في استشارتك هنا. بسألك أسئلة وحدة وحدة عشان نقرّب لك مكان ألمك المحتمل.')+`<h1>${T(['Where is the Pain?','وين الألم؟'])}</h1><h2>${T(['وين الألم','Where is the Pain?'])}</h2><p class="lead">${T(['Feeling pain but not sure where it comes from? Answer detailed questions and we will narrow down the likely cause and suggest relief methods that fit the area.','تحس بألم وما تدري من وين؟ جاوب على أسئلة دقيقة ونقرّب لك مكانه المحتمل ونعطيك طرق تخفيف تناسب مكان ألمك.'])}</p><div class="card"><b>${T(['Before you start','قبل ما نبدأ'])}</b><p>${T(['This app gives general guidance only. It does not diagnose and does not replace a doctor.','هذا التطبيق يعطي إرشادات عامة فقط، ولا يشخّص ولا يغني عن الطبيب.'])}</p></div><button class="btn" onclick="go('age')">${T(['I understand, start','فهمت، ابدأ'])}</button>`,

<h3>${T(['Exercises for your pain level','تمارين تناسب مستوى ألمك'])}</h3><div class="card">${li([g.t,k.ex[L<=2?0:L==3?1:2]])}</div>

${S.nm?`<div class="card"><p>${T(['No more questions left. You can finish or restart.','ما بقي أسئلة إضافية. تقدر تنهي أو تبدأ من جديد.'])}</p></div>`:''}
<button class="btn" onclick="more()">${T(['Answer more questions to refine','جاوب على أسئلة أكثر لتدقيق النتيجة'])}</button><button class="btn o" onclick="go('end')">${T(['Finish','إنهاء'])}</button>`},
end:()=>`<h1 class="s">${T(['Take care','سلامتك'])}</h1><svg viewBox="0 0 240 150" width="100%"><rect width="240" height="150" rx="18" fill="var(--c)" stroke="var(--b)"/><circle cx="70" cy="75" r="42" fill="var(--t)"/><path d="M70 52v46M47 75h46" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M122 98l16-30 16 44 14-28h30" fill="none" stroke="var(--t)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="card warn"><b>${T(['If the pain increases or you need more help, see a doctor.','إذا زاد الألم أو احتجت مساعدة أكثر، راجع الطبيب.'])}</b><ul><li>${T(['Pain increases a lot or becomes unbearable','زاد الألم بشكل كبير أو صار لا يُحتمل'])}</li><li>${T(['Fever, swelling, numbness or weakness appears','ظهرت حرارة أو تورم أو تنميل أو ضعف'])}</li><li>${T(['No improvement after a few days of self-care','ما تحسّن بعد أيام من العناية الذاتية'])}</li><li>${T(['Pain after a strong blow or fall','ألم بعد ضربة أو سقطة قوية'])}</li></ul></div><p class="lead">${T(['General guidance only. It does not diagnose and does not replace a doctor.','إرشادات عامة فقط. لا يشخّص ولا يغني عن الطبيب.'])}</p><button class="btn o" onclick="S.st='res';r()">${T(['Back to results','الرجوع للنتيجة'])}</button><button class="btn" onclick="rs()">${T(['Start over','ابدأ من جديد'])}</button>`};
